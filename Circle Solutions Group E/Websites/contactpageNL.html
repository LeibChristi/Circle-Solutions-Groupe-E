<!DOCTYPE html>
<html lang="nl">
<head>
    <link rel="stylesheet" href="stylecontact.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Solutions — Neem contact op</title>
</head>
<header>
    <nav>
        <img src="images/logoimg.jpeg" alt="circle_solutions_logo_01">
        <div class="menu-buttons">
            <div class="aboutbutton"><a href="Homepage.html" class="nav-button">Home</a></div> 
            <div class="homebutton"><a href="aboutus.html" class="nav-button">Over ons</a></div>
        </div>
        <div class="language-switch">
            <a href="contactpage.html">EN</a><a href="contactpageNL.html">/NL</a>
        </div>
    </nav>
</header>
<body>
    <div class="tittle">
        <h1>Hoe kunnen we</h1>
        <h1>u helpen?</h1>
    </div>
    <div class="contact-card">
        <div class="tittle2">
            <h1>Samenwerken?</h1><br>
            <p>We werken graag aan mooie, converterende,</p>
            <p>maar vooral technisch uitdagende producten.</p><br>
            <p>Kunnen wij u helpen?</p>
        </div> 
        <div class="contact-form">
            <input type="text" id="Company-name" name="companyname" placeholder="Bedrijfsnaam*"><br><br>
            <input type="text" id="Contact-person" name="contactperson" placeholder="Contactpersoon*"><br><br>
            <input type="text" id="email" name="email" placeholder="E-mailadres*"><br><br>
            <input type="text" id="subject" name="subject" placeholder="Onderwerp*"><br><br>
            <textarea id="message" name="message" placeholder="Wat is uw uitdaging?"></textarea><br><br>
            <button>Versturen</button>
        </div>
    </div>
</body>
<footer>
