<!DOCTYPE html>
<html lang="nl">
<head>

    <title>Circle Solutions — Neem contact op</title>
</head>
<header>
    <nav>
        <img src="images/logoimg.jpeg" alt="circle_solutions_logo_01">
        <div class="menu-buttons">
            <div class="aboutbutton"><a href="HomepageNL.html" class="nav-button">Home</a></div>
            <div class="homebutton"><a href="aboutusNL.html" class="nav-button">Over ons</a></div>
        </div>
        <div class="language-switch">
            <a href="contactpage.html">EN</a><a href="contactpageNL.html">/NL</a>

<body>
    <div class="tittle">
        <h1>Hoe kunnen we</h1>
        <h1>u helpen?</h1>
    </div>
    <div class="contact-card">
        <div class="tittle2">
            <h1>Samenwerken?</h1><br>
            <p>We werken graag aan mooie, converterende,</p>
            <p>maar vooral technisch uitdagende producten.</p><br>
            <p>Kunnen wij u helpen?</p>
        </div> 
        <form class="contact-form" action="mailto:hi@circlesolutions.com" method="post" enctype="text/plain">
         <textarea type="text" id="Company-name" name="Bedrijfsnaam" placeholder="Bedrijfsnaam*" required></textarea><br><br>
         <textarea type="text" id="Contact-person" name="Contactpersoon" placeholder="Contactpersoon*" required></textarea><br><br>
         <textarea type="text" id="email" name="Email" placeholder="E-mailadres*" required></textarea><br><br>
         <textarea type="text" id="subject" name="Onderwerp" placeholder="Onderwerp*" required></textarea><br><br>
         <textarea id="message" name="Bericht" placeholder="Wat is uw uitdaging?"></textarea><br><br>
         <button type="submit">Versturen</button>
        </form>
        
    </div>
</body>
